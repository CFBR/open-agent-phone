# ============================================================================
# Docker Compose — Full Self-Contained Deployment
# ============================================================================
#
# One-file deployment: all services in Docker, no native dependencies.
# Zero billing defaults (Ollama + Kokoro), no API keys required.
#
# Usage:
#   1. Copy .env.example to .env, fill in your settings
#   2. docker compose -f docker-compose.full.yml up -d
#
# This replaces the need for a separate Raspberry Pi — runs on any
# Linux x86/ARM server with Docker.
#
# ============================================================================

# ============================================================================
# Services
# ============================================================================
services:

  # ------------------------------------------------------------------
  # 3CX SBC — Session Border Controller (connects to 3CX cloud)
  # ------------------------------------------------------------------
  #
  # ⚠️  As of 2026, 3CX no longer provides a standalone x86 Debian package.
  #    The SBC must be installed natively on your host or via the 3CX
  #    Debian ISO. See docker/sbc/Dockerfile for details.
  #
  # To skip the SBC entirely, leave the "sbc" profile disabled (default).
  # For port-forwarding SIP, route 5060 UDP/TCP to this server's drachtio.
  #
  # ------------------------------------------------------------------
  sbc:
    image: alpine:3.20
    profiles: ["sbc"]
    container_name: sbc
    restart: unless-stopped
    network_mode: host
    # The SBC must be installed natively. This placeholder keeps the compose
    # graph valid without building an image that cannot run.
    command: ["sleep", "infinity"]

  # ------------------------------------------------------------------
  # Drachtio — SIP server
  # ------------------------------------------------------------------
  # Uses 5070 (not 5060) because 3CX SBC occupies 5060
  # ------------------------------------------------------------------
  drachtio:
    image: drachtio/drachtio-server:latest
    container_name: drachtio
    restart: unless-stopped
    network_mode: host
    command: >
      drachtio
      --contact "sip:*:${DRACHTIO_SIP_PORT:-5070};transport=tcp,udp"
      --external-ip ${EXTERNAL_IP}
      --secret ${DRACHTIO_SECRET:-cymru}
      --port 9022
      --loglevel info
    # Ports: 5060/5070 SIP, 9022 admin

  # ------------------------------------------------------------------
  # FreeSWITCH — Media server (RTP audio)
  # ------------------------------------------------------------------
  freeswitch:
    image: open-agent-phone-freeswitch:latest
    build:
      context: .
      dockerfile: docker/freeswitch/Dockerfile
    container_name: freeswitch
    restart: unless-stopped
    network_mode: host
    command: >
      freeswitch
      --sip-port 5080
      --rtp-range-start 30000
      --rtp-range-end 30100
      --ext-rtp-ip ${EXTERNAL_IP}
      --ext-sip-ip ${EXTERNAL_IP}
      --advertise-external-ip
    environment:
      - EXTERNAL_IP=${EXTERNAL_IP}
    # Ports: 5080 SIP, 8021 ESL, 30000-30100 RTP

  # ------------------------------------------------------------------
  # Voice App — STT, TTS, call orchestration
  # ------------------------------------------------------------------
  voice-app:
    build: ./voice-app
    container_name: voice-app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./voice-app/audio:/app/audio
      - ./voice-app/config:/app/config
    depends_on:
      - drachtio
      - freeswitch
    # Ports: 3000 HTTP, 3001 WS

  # ------------------------------------------------------------------
  # Kokoro TTS — Local text-to-speech (OpenAI-compatible API)
  # ------------------------------------------------------------------
  # ~2-3GB RAM on CPU. Free, no API key needed.
  # Quality: #2 in TTS Arena (behind ElevenLabs, better than most paid)
  # ------------------------------------------------------------------
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    restart: unless-stopped
    network_mode: host
    # Port: 8880 HTTP (OpenAI-compatible /v1/audio/speech)

  # ------------------------------------------------------------------
  # Speaches — Local STT (faster-whisper, OpenAI-compatible)
  # ------------------------------------------------------------------
  # Optional. Start with:
  #   docker compose -f docker-compose.full.yml --profile local-stt up -d
  # Then set STT_PROVIDER=local and LOCAL_WHISPER_URL=http://127.0.0.1:7000.
  # Image is pinned to the latest-cpu tag published on 2026-11-03.
  # ------------------------------------------------------------------
  faster-whisper:
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    profiles: ["local-stt"]
    container_name: faster-whisper
    restart: unless-stopped
    network_mode: host
    environment:
      UVICORN_HOST: 127.0.0.1
      UVICORN_PORT: 7000
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-base}
    volumes:
      - whisper-data:/home/ubuntu/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Port: 7000 HTTP (OpenAI-compatible /v1/audio/transcriptions)

  # ------------------------------------------------------------------
  # AI Backend — Pluggable AI provider (Ollama, Claude CLI, etc.)
  # ------------------------------------------------------------------
  # Default: Ollama (local, free). Set AI_BACKEND in .env to change.
  #
  #   AI_BACKEND=ollama     → Ollama (free, default)
  #   AI_BACKEND=claude     → Claude CLI (mount ~/.claude volume)
  #   AI_BACKEND=openai     → OpenAI API (set OPENAI_API_KEY)
  #   AI_BACKEND=openrouter → OpenRouter (set OPENROUTER_API_KEY)
  #   AI_BACKEND=custom     → Any OpenAI-compatible API
  # ------------------------------------------------------------------
  ai-backend:
    build:
      context: .
      dockerfile: docker/api-server/Dockerfile
    container_name: ai-backend
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      AI_BACKEND: ${AI_BACKEND:-ollama}
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      # Claude CLI auth (only needed if AI_BACKEND=claude)
      - ${HOME:-/root}/.claude:/root/.claude:ro
    depends_on:
      - ollama
    # Port: 3333 HTTP (AI query API)

  # ------------------------------------------------------------------
  # Ollama — Local LLM (free, no API key)
  # ------------------------------------------------------------------
  # Runs Llama 3.2 3B by default (~2GB RAM, works on CPU).
  # For better quality, swap to a larger model in OLLAMA_MODEL.
  #
  # ⚠️ First startup: Ollama auto-pulls the model on first request.
  #    This may take a few minutes depending on model size and
  #    internet speed. Subsequent starts are instant.
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    network_mode: host
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 24h  # Keep model loaded between calls
    volumes:
      - ollama-data:/root/.ollama
    # Port: 11434 HTTP (OpenAI-compatible API)

  # ------------------------------------------------------------------
  # [Optional] Cloudflare Tunnel — Expose the API securely
  # ------------------------------------------------------------------
  # Uncomment to expose voice-app behind Cloudflare Tunnel.
  # Requires: cloudflared tunnel login, tunnel credentials file.
  # ------------------------------------------------------------------
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

# ============================================================================
# Named volumes
# ============================================================================
volumes:
  ollama-data:
  whisper-data:
